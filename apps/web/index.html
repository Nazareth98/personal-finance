<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" />
    <script>
      // Apply the theme before CSS/React paints to prevent a Light-to-Dark flash.
      (() => {
        let choice = 'system';
        try { choice = localStorage.getItem('pf-theme') || 'system'; } catch {}
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = choice === 'dark' || (choice !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B1220' : '#F8FAFC';
      })();
    </script>
    <title>Personal Finance — Corporate UI</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
