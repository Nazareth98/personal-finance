<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="application-name" content="Balanço" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Balanço" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the theme before CSS/React paints to prevent a Light-to-Dark flash.
      (() => {
        let choice = 'system';
        try { choice = localStorage.getItem('pf-theme') || 'system'; } catch {}
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = choice === 'dark' || (choice !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B1220' : '#F8FAFC';
      })();
    </script>
    <title>Balanço</title>
  </head>
  <body><div id="root"><!-- Mesma marcação de BootSplash (D-044): o React substitui ao montar. -->
    <main class="boot-splash" aria-busy="true">
      <span class="boot-splash__icon"><svg class="ui-brand-mark ui-brand-mark--animated" width="48" height="48" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs><clipPath id="pf-boot"><circle cx="32" cy="32" r="23" /></clipPath></defs>
        <g class="ui-brand-mark__in" transform="translate(0 -3)"><rect x="9" y="9" width="21" height="46" rx="6" fill="currentColor" clip-path="url(#pf-boot)" /></g>
        <g class="ui-brand-mark__out" transform="translate(0 3)"><rect x="34" y="9" width="21" height="46" rx="6" fill="currentColor" fill-opacity="0.45" clip-path="url(#pf-boot)" /></g>
      </svg></span>
      <span class="boot-splash__name">Balanço</span>
      <p class="boot-splash__status" role="status">Carregando…</p>
    </main>
  </div><script type="module" src="/src/main.tsx"></script></body>
</html>
