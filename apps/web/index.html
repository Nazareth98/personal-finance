<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="application-name" content="Personal Finance" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // Apply the theme before CSS/React paints to prevent a Light-to-Dark flash.
      (() => {
        let choice = 'system';
        try { choice = localStorage.getItem('pf-theme') || 'system'; } catch {}
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = choice === 'dark' || (choice !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B1220' : '#F8FAFC';
      })();
    </script>
    <title>Personal Finance — Corporate UI</title>
  </head>
  <body><div id="root"><!-- Mesma marcação de BootSplash (D-044): o React substitui ao montar. -->
    <main class="boot-splash" aria-busy="true">
      <img class="boot-splash__icon" src="/icons/icon.svg" alt="" width="72" height="72" />
      <span class="boot-splash__name">Personal Finance</span>
      <span class="boot-splash__bar" aria-hidden="true"></span>
      <p class="boot-splash__status" role="status">Carregando…</p>
    </main>
  </div><script type="module" src="/src/main.tsx"></script></body>
</html>
