<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>Balanço — sem conexão</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f8fafc;color-scheme:light dark}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
      main{width:min(100%,420px);padding:28px;border:1px solid #cbd5e1;border-radius:16px;background:#fff;box-shadow:0 12px 36px rgba(15,23,42,.08)}
      h1{font-size:24px;margin:0 0 12px}p{line-height:1.6;margin:0 0 20px;color:#475569}
      button{font:700 15px/1 system-ui;border:0;border-radius:10px;padding:13px 18px;background:#1d4ed8;color:#fff;cursor:pointer}
      @media(prefers-color-scheme:dark){:root{color:#e5e7eb;background:#0b1220}main{background:#111b2e;border-color:#334155}p{color:#aebbd0}}
    </style>
  </head>
  <body><main><h1>Você está sem conexão</h1><p>Por segurança, dados financeiros não ficam disponíveis offline. Reconecte-se para autenticar e carregar o livro.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main></body>
</html>
