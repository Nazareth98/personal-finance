<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Balanço arredondado (D-045): metades de um círculo r 23 (grade 64), vão 4, desencontro ±3. -->
  <rect width="512" height="512" fill="#2563EB"/>
  <defs><clipPath id="in"><circle cx="32" cy="29" r="23"/></clipPath><clipPath id="out"><circle cx="32" cy="35" r="23"/></clipPath></defs>
  <g transform="translate(128 128) scale(4)">
    <rect x="9" y="6" width="21" height="46" rx="6" fill="#FFF" clip-path="url(#in)"/>
    <rect x="34" y="12" width="21" height="46" rx="6" fill="#FFF" fill-opacity="0.55" clip-path="url(#out)"/>
  </g>
</svg>
