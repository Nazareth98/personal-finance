name: Corporate UI — regressão visual e acessibilidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # Initial one-time baseline; verification is read-only.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Initialize first Linux visual baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -d apps/web/tests/e2e/__screenshots__ ]; then
            pnpm test:visual:update
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/tests/e2e/__screenshots__
            git commit -m "test(visual): seed 36 Light Dark template baselines [skip ci]"
            git push
          fi
      - name: Verify visual snapshots
        run: pnpm test:visual
      - name: Test theme navigation and responsive layout
        run: pnpm test:e2e
      - name: Accessibility audit (WCAG A/AA)
        run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
            apps/web/tests/e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
