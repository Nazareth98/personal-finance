name: Corporate UI — regressão visual e acessibilidade

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Rodadas com [update visual baselines] ficam num grupo próprio: um push seguinte não as cancela.
  group: browser-${{ github.workflow }}-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[update visual baselines]') && 'baseline' || 'check' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    # Cópias (forks) de outras instâncias não rodam a validação: só usam o código já validado aqui (D-066).
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # Initial one-time baseline; verification is read-only.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Initialize first Linux visual baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VISUAL_REFRESH: ${{ contains(github.event.head_commit.message, '[update visual baselines]') }}
        run: |
          if [ ! -d apps/web/tests/e2e/__screenshots__ ] || [[ "$VISUAL_REFRESH" == "true" ]]; then
            pnpm test:visual:update
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/tests/e2e/__screenshots__
            if ! git diff --cached --quiet; then
              git commit -m "test(visual): review/update 78 Light Dark baselines [skip ci]"
              git push
            else
              echo "Visual baselines are already up to date."
            fi
          fi
      - name: Verify visual snapshots
        run: pnpm test:visual
      - name: Test theme navigation and responsive layout
        run: pnpm test:e2e
      - name: Accessibility audit (WCAG A/AA)
        run: pnpm test:a11y
      - name: Async chart, error and loading behavior
        run: pnpm test:states
      - name: Authenticated financial flows
        run: pnpm test:auth
      - name: Production PWA offline boundary
        run: pnpm test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
            apps/web/tests/e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
