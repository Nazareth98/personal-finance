name: Sincronizar com o projeto original

# D-066: só roda em cópias (forks) de outras instâncias. Uma vez por dia traz a `main` do projeto
# original. O push resultante dispara "Supabase — publicar backend" e o deploy da Vercel da cópia.
# Precisa do secret de repositório SYNC_TOKEN: token clássico da dona da cópia com os escopos
# `repo` e `workflow` (o GITHUB_TOKEN não pode atualizar arquivos de workflow nem disparar outros workflows).

on:
  schedule:
    - cron: '17 9 * * *' # 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trazer novidades do projeto original
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o secret SYNC_TOKEN (token clássico com escopos repo e workflow). Veja o guia de instalação, etapa 3."
            exit 1
          fi
          status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/merge-upstream" -d '{"branch":"main"}')
          case "$status" in
            200) echo "::notice::$(jq -r '.message' result.json)";;
            409) echo "::error::A cópia tem alterações próprias e não dá para juntar automaticamente. Peça ajuda a quem administra o projeto."; exit 1;;
            401|403) echo "::error::O SYNC_TOKEN foi recusado (vencido ou sem os escopos repo e workflow). Gere outro e atualize o secret."; exit 1;;
            *) echo "::error::O GitHub respondeu $status."; cat result.json; exit 1;;
          esac
